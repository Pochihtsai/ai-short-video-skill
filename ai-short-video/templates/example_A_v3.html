<!doctype html>
<html lang="zh-Hant">
  <!--
    直式寫法範本（1080×1920）。只示範「怎麼寫」，沒有故事、沒有風格：
    字型設定、版面數字、時間軸註冊、第 0 格不留白、鏡頭推近、依序進場、字幕迴圈、音軌、影片片段、結尾收與淡出。
    畫面元素都是灰色方塊和「元素 1、2、3」這類佔位字，做片時全部換成本片自己的故事和風格，不要沿用。
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* 中文字型：同一個 @font-face 列出 Mac 和 Windows 的字型（只能本機渲染） */
      @font-face { font-family: "TC"; src: local("PingFangTC-Medium"), local("PingFang TC Medium"), local("Microsoft JhengHei"), local("微軟正黑體"); font-weight: 500; }
      @font-face { font-family: "TC"; src: local("PingFangTC-Semibold"), local("PingFang TC Semibold"), local("Microsoft JhengHei Bold"), local("Microsoft JhengHei"); font-weight: 600; }
      :root { --ink: #2a2f33; --ink-2: #5d656b; --line: #c9ced2; --accent: #c2512f; --bg: #f2f3f4; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "TC", sans-serif; color: var(--ink); background: var(--bg); }
      /* 鏡頭：把要一起推近、拉遠的內容包在 #world 裡，動 #world 的 scale／x／y；字幕放在 #world 外面，才不會跟著動 */
      #world { position: absolute; inset: 0; transform-origin: 450px 312px; }  /* 原點放在標題頂端，推近時標題不會被推出安全範圍 */
      /* 直式構圖中心線 x=450；安全範圍 垂直 288–1248，水平 120–888（y≥840 時到 780） */
      .title { position: absolute; left: 120px; width: 660px; top: 312px; text-align: center; font-size: 96px; font-weight: 500; line-height: 1.15; }
      .title em { font-style: normal; font-weight: 600; color: var(--accent); }
      .box { position: absolute; top: 640px; width: 190px; height: 190px; border-radius: 24px; background: #fff; border: 3px solid var(--line); font-size: 36px; line-height: 184px; text-align: center; color: var(--ink-2); }
      .bar { position: absolute; left: 165px; top: 920px; width: 570px; height: 18px; border-radius: 9px; background: #e3e6e8; overflow: hidden; }
      .bar i { display: block; width: 100%; height: 100%; background: var(--accent); transform-origin: left center; }
      .end { position: absolute; left: 120px; width: 660px; top: 600px; text-align: center; font-size: 104px; font-weight: 600; line-height: 1.2; }
      #fade { position: absolute; inset: 0; background: var(--bg); }
      /* 字幕：left 120、寬 660、top 1163；中文 46px；一次一組 */
      #captions { position: absolute; inset: 0; }
      .cap { position: absolute; left: 120px; width: 660px; top: 1163px; text-align: center; opacity: 0; visibility: hidden; }
      .cap span { display: inline-block; max-width: 660px; padding: 10px 28px; border-radius: 16px; background: rgba(42, 47, 51, 0.86); color: #fff; font-size: 46px; font-weight: 500; line-height: 1.3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="world">
        <!-- 第一幕：標題第 0 格就看得到（第 0 格是平台與網頁的縮圖，不要留白） -->
        <div class="title" id="s1-title">寫法<em>範本</em></div>
        <div class="box" id="b1" style="left: 165px">元素 1</div>
        <div class="box" id="b2" style="left: 355px">元素 2</div>
        <div class="box" id="b3" style="left: 545px">元素 3</div>
        <div class="bar" id="s2-bar"><i id="s2-fill"></i></div>
        <!-- 結尾：拿掉進行中的元素，換成收尾版面 -->
        <div class="end" id="s3-end" style="opacity: 0">結尾核心句</div>
      </div>

      <!--
        節錄影片片段的寫法：<video> 要放在最外層（#root 底下），自己帶 data-start、data-duration、data-track-index，
        不能放在有時間設定的容器裡，否則 check 會報錯。外框、標籤另外畫在上面，用動畫控制淡入淡出。
        <video id="clip1" class="clip" src="assets/clips/clip1.mp4" muted playsinline data-start="3" data-duration="4" data-track-index="3"
               style="position:absolute; left:240px; top:600px; width:420px; height:746px; object-fit:cover"></video>
      -->

      <div id="fade" style="opacity: 0"></div>

      <!-- 字幕：用 scripts/captions_html.py 把 captions.json 寫進兩行標記中間，不要手寫 -->
      <div id="captions" class="clip" data-start="0" data-duration="10" data-track-index="2" data-track-kind="captions">
        <!-- captions:begin -->
        <div class="cap" data-s="0.1" data-e="2.6"><span>這是寫法範本</span></div>
        <div class="cap" data-s="2.7" data-e="5.6"><span>內容依每支片重新設計</span></div>
        <div class="cap" data-s="5.7" data-e="7.4"><span>不要沿用這些方塊</span></div>
        <!-- captions:end -->
      </div>

      <!-- 音軌：配音音量 1；配樂的 data-volume 用 scripts/music_volume.py 算，不要套固定值；
           每個音效都要寫 data-duration（ffprobe 量或看音效庫的 manifest.json），否則會被當成播到片尾 -->
      <audio id="voice" class="clip" src="assets/audio/voice.mp3" data-start="0" data-track-index="5" data-volume="1"></audio>
      <audio id="bgm" class="clip" src="assets/bgm/bgm.mp3" data-start="0" data-track-index="6" data-volume="0.2"></audio>
      <audio id="sfx-1" class="clip" src="assets/sfx/pop.mp3" data-start="0.9" data-duration="0.72" data-track-index="7" data-volume="0.35"></audio>
      <audio id="sfx-2" class="clip" src="assets/sfx/pop.mp3" data-start="1.05" data-duration="0.72" data-track-index="8" data-volume="0.35"></audio>
      <audio id="sfx-3" class="clip" src="assets/sfx/pop.mp3" data-start="1.2" data-duration="0.72" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.5" data-duration="0.57" data-track-index="7" data-volume="0.35"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 依序進場（Motion Prompt #002 Stagger 的寫法）。用 fromTo 寫進場，開始前會停在起始值（這裡是透明），不必另外在第 0 秒 tl.set。
      // 同一個元素有兩段 fromTo 時，後面那段加 immediateRender:false，否則它的起始值會蓋掉前一段
      ["#b1", "#b2", "#b3"].forEach((b, i) =>
        tl.fromTo(b, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.9 + i * 0.15));

      // 鏡頭推近：動 #world，字幕不受影響。橫式推近時注意主畫面底部不要壓到字幕上緣
      tl.fromTo("#world", { scale: 1 }, { scale: 1.08, duration: 3, ease: "power2.inOut" }, 2.7);
      tl.fromTo("#s2-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.6, ease: "power2.out" }, 3.2);

      // 結尾：進行中的元素退場 → 收尾版面 → 停住 → 和音樂一起淡到底色
      tl.to(["#s1-title", "#b1", "#b2", "#b3", "#s2-bar"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 7.3);
      tl.to("#world", { scale: 1, duration: 0.9, ease: "power3.out" }, 7.4);
      tl.fromTo("#s3-end", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 7.5);
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power1.in" }, 8.8);

      // 字幕：一次只出現一組，結束時硬關
      document.querySelectorAll(".cap").forEach((g) => {
        const s = +g.dataset.s, e = +g.dataset.e;
        tl.set(g, { visibility: "visible" }, s);
        tl.fromTo(g, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.15, ease: "power2.out" }, s);
        tl.to(g, { opacity: 0, duration: 0.1, ease: "power2.in" }, e - 0.1);
        tl.set(g, { opacity: 0, visibility: "hidden" }, e);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
